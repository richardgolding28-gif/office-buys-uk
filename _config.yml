  WFH gear that's actually worth the money.
baseurl: "/office-buys-uk"
url: "https://richardgolding28-gif.github.io"

theme: minima
minima:
  skin: dark

# Amazon Associates (UK, amazon.co.uk) tracking ID — every affiliate link on the site reads this value.
amazon_tag: "trailandtarp-21"

# Google Search Console ownership verification (jekyll-seo-tag outputs this automatically)
google_site_verification: tXgJa5JjqqaDelg_4j5mTtVWsSRiUVL5MoYlVs3NGCQ

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - about.md
  - disclosure.md

markdown: kramdown
permalink: /:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
